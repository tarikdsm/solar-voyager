id: T0155
title: Isolate browser-harness ports per worktree
status: DONE
agent: claude
branch: task/T0155-harness-port-isolation
depends_on: []
milestone: V2M6
spec: |
  Thirty-six browser harnesses and benches hardcode a listen port, and the pool is reused: 4176,
  4177, 4178, 4179, 4180, 4185, 4186, 4187, 4188 and 4198 each appear in two or three files. CI runs
  them one at a time so it never mattered. Parallel task worktrees run them at the same time, where
  a collision is a hard failure that reads exactly like a real defect: T0127 lost three gate runs to
  "Port 4177 is already in use" held by another lane's flightBench, and a bench paired against a
  contended run produced a 2x p75 "regression" that did not survive scrutiny.
  Derive a per-checkout port offset so concurrent worktrees cannot collide, with CI behaviour
  bit-identical.
acceptance:
  - A single shared helper owns port resolution and every harness and bench uses it
  - A checkout outside .worktrees resolves to the historical port, so CI is unchanged
  - Two checkouts under .worktrees with different directory names resolve to different ports, proven
    by a unit test
  - The offset is stable across runs for the same worktree, so a failure is reproducible
handoff_notes: |
  tools/harnessPort.mjs owns port resolution; all 35 harnesses and benches call
  resolveHarnessPort(<historical port>). The offset comes from the CHECKOUT PATH, not an environment
  variable, so no runner has to remember to set anything, and a checkout outside .worktrees resolves to
  its historical port — that is what keeps CI bit-identical. The offset is a stable FNV-1a hash of the
  worktree name so a collision stays reproducible instead of becoming a lottery.
  If you add a harness, call resolveHarnessPort rather than writing a literal, and do not assume your
  port is free on a developer machine running several worktrees.
  The first CI run failed on a Windows-literal path fixture: a backslash is a separator on Windows and a
  legal filename character on Linux, so the test passed locally and failed on ubuntu. Build path fixtures
  with path.join.
  Measured: main 4177, .worktrees/T0116 5713, .worktrees/T0127 5969, .worktrees/T0144 4241.
  Verification: harnessPort.test.mjs 6 passed; lint, typecheck, format clean; proven end to end by
  running test:render-depth and test:starfield inside a worktree checkout, both green on offset ports.
