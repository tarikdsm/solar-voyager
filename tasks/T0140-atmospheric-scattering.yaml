spec: |
  The single biggest visual lever in v2: a single-scatter analytic shell that replaces the rim hack with a blue limb, a red terminator and honest haze.
  Spec of record: docs/superpowers/specs/2026-08-14-v2-free-flight-design.md section 6.1.
  Full task definition (files, interfaces, tests, landmines) in docs/superpowers/plans/2026-08-14-v2-free-flight.md, section 5, task T0140.
acceptance:
  - data/atmospheres.json plus its schema and ADR-040 carry per-body rayleighRGB, mieCoeff,
    scaleHeightKm and deckRadiusKm
  - A single-scatter analytic shell shader with per-pixel sun angle and a limb integration
    approximation replaces the earthSurfaceLayers rim hack and covers the Earth blue limb, Venus and
    Titan haze, Mars dust and giant limb glow
  - Correctness proxies are tested as monotonic limb brightness against sun angle plus screenshot
    diffs for four poses per hero body
  - Governed with shader steps 8, 4 and off, zero allocation, bench evidence, and aerial perspective
    applied to close-range detail on atmosphere bodies
handoff_notes: |
  Keep it a hook on the existing material pattern, a shell mesh like earthSurfaceLayers but carrying the scattering integral. Parameters live in data, not code.
