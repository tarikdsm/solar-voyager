id: T0127
title: Pass-insertion API and adaptive exposure controller
status: DONE
agent: claude
branch: task/T0127-adaptive-exposure
depends_on:
  - T0103
milestone: V2M3
spec: |
  Gives the post pipeline a public way to insert passes, then uses it for a single-owner adaptive exposure controller so Neptune daylight reads and the near-Sun photosphere does not clip.
  Spec of record: docs/superpowers/specs/2026-08-14-v2-free-flight-design.md section 6.2; plan section 3.5.
  Full task definition (files, interfaces, tests, landmines) in docs/superpowers/plans/2026-08-14-v2-free-flight.md, section 5, task T0127.
acceptance:
  - lightingPostPipeline gains insertPass with an ordering contract and tests, leaving the default
    pass order unchanged and every render browser gate green
  - Exposure follows plan section 3.5 with the correct trend proven at Mercury, Earth, Neptune and
    near-Sun test poses and adaptation constants of 2 s and 6 s within 10 percent
  - visualTier magnitude tests are untouched and green because exposure is display-only
  - Settings expose auto and fixed exposure modes and the governor can pin fixed on a low tier
handoff_notes: |
  T0142 IS THE FIRST EXTERNAL CONSUMER. Use insertPass(pass, 'relativistic') for god rays (after
  aberration so the screen-space sun position matches the shifted image, before bloom so the rays
  bloom) and insertPass(pass, 'bloom') for the flare. The pipeline TAKES OWNERSHIP: it sizes your
  pass through the composer, calls setRenderScale if you implement AdaptivePostPassPort,
  force-enables it for the warm-up render so precompile happens there, and disposes in reverse
  insertion order. Never call composer.insertPass directly and never call insertPass from the frame
  loop. POST_PASS_ANCHORS is exported for tests.
  EXPOSURE IS NOT A POST PASS. Implementing plan section 3.5 literally appends a seventh entry to
  composer.passes by default, which the frozen passNames gate forbids. The pipeline implements a
  one-method ExposureSinkPort instead and stays the only module touching renderer.toneMappingExposure
  — do not add a second writer. Adaptation is a first-order lag in LOG exposure, so tau means the
  same thing across the 7-stop range.
  THREE.JS CANARY: VALIDATED_THREE_REVISION = '185' in lightingPostPipeline.ts. A version bump fails
  lightingPostPipeline.canary.test.ts immediately; re-validate SMAA_INTERNAL_FIELDS,
  BLOOM_INTERNAL_FIELDS and the vUv rewrite before moving the constant. The canary builds the real
  passes in Node with a five-line Image stub, no GPU needed.
  TWO PRE-EXISTING RADIOMETRIC BUGS BOUND THE EXPOSURE WINDOW, neither fixed here.
  (a) SUN_EMISSIVE_INTENSITY = 4 in bodyVisualSystem.ts is distance-independent, so the solar disc
  gets DIMMER as you approach; it alone sets E_min = 1/8. T0141 should retune E_min together with the
  Sun's radiance. (b) AMBIENT_LIGHT_INTENSITY = 0.02 in solarLighting.ts is never rescaled by
  SolarLighting.update(), which only touches the directional light. At Neptune the ambient term is
  about 5.8x the sunlight, so the terminator is washed out AT ANY EXPOSURE — exposure is a gain and
  cannot restore contrast. That caps E_max at 16 and belongs to T0123 or T0140.
  ExposureController.reset(camera, dominantBodyIndex) snaps with no fade — call it after any camera
  discontinuity (restore teleport, cruise insertion, respawn). update() takes the WALL delta.
  Diagnostics went from seven canvas objects to eight (solarVoyagerExposure). Settings gained
  render.exposureMode; any harness seeding a profile must include it, the parser is strict.
  Verification: 1300 Vitest passed / 3 skipped; lighting-post, visual-tiers, procedural-sun,
  relativistic-visuals, perf-governor, session-settings, hud-presets, tutorial, startup, main-menu,
  smoke all green. Draw calls 49 and triangles 70,452 identical; heap LOWER than baseline; bundle
  +2,026 B gzip. No golden or budget moved. The raw bench pairing showed a 2x p75 "regression" that
  did not survive scrutiny — the harness's own variance gate failed the feature build against ITSELF
  under parallel-lane load; docs/bench/T0127-summary.md records the analysis instead of the number.
