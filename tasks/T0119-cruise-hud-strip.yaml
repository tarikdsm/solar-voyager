spec: |
  The HUD surface that makes a relativistic cruise legible and dramatic: phase, target, both clocks, current compression and the peak-beta forecast, present in every preset.
  Spec of record: docs/superpowers/specs/2026-08-14-v2-free-flight-design.md section 4.3 and 7.
  Full task definition (files, interfaces, tests, landmines) in docs/superpowers/plans/2026-08-14-v2-free-flight.md, section 5, task T0119.
acceptance:
  - The strip shows phase, target, ETA in coordinate and proper time, current compression, peak beta
    forecast and the abort hint, with gamma highlighted above 1.001
  - Present in all HUD presets including Clean, driven by the 10 Hz signals pattern with zero frame
    allocation
  - The system map gains engage-cruise on the selected body, wiring T0117
  - A browser gate asserts the strip renders during a scripted cruise and that the clocks visibly
    diverge on a 0.3c leg
handoff_notes: |
  PAUSED MID-TASK 2026-08-16 with an agent working in .worktrees/T0119 on branch
  task/T0119-cruise-hud-strip. Check git log and git status there before restarting; the lane was told
  to commit as it goes. Nothing is pushed and no PR exists.
  THE LANDMINE THAT WILL COST A RUN: #cruise-status sits directly above the navball in a
  bottom-anchored stack that GROWS UPWARD, and this task replaces it wholesale. T0117's first draft
  added a second line, moved the whole HUD cluster 11 px toward the viewport middle and made the pick
  gate miss Earth's disc (cluster top 227 px on main, 216 broken, 223 fixed). test:hud-presets is the
  only gate that catches it AND IT CATCHES IT AS A PICKING FAILURE, which reads like a bug in code
  this task never touched.
  Read TargetSelectionController.selectedBodyId, NOT SystemMapController.focusId — the latter also
  moves for camera-only focus changes the controller rejected as targets. Pass the engage button as
  CruiseTargetControl's children; the space-view mount point is #hud-set-cruise-target.
  CruiseDirector.engage() returns false when the catalogs disagree about the body; surface it.
  The "clocks visibly diverge" assertion must be bounded in RENDERED FRAMES or on the divergence
  itself, never in seconds: three lanes have now shipped a wall-clock budget that passed here and
  failed on the SwiftShader runner.
