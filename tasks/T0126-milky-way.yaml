spec: |
  The sky stops being black with dots. A correctly oriented galactic panorama behind the star Points, plus the zodiacal band and an optional constellation overlay.
  Spec of record: docs/superpowers/specs/2026-08-14-v2-free-flight-design.md section 6.4.
  Full task definition (files, interfaces, tests, landmines) in docs/superpowers/plans/2026-08-14-v2-free-flight.md, section 5, task T0126.
acceptance:
  - A CC-licensed ESO or Gaia-derived panorama ships as a KTX2 equirect sphere behind the star
    Points with correct galactic orientation against J2000, verified against three bright-star
    positions in a test, and attribution in credits and SOURCES.md
  - Lazy-loaded after activation and never in initial-path.json, leaving the startup gate unchanged
  - Zodiacal light renders as a faint ecliptic-plane additive gradient, at most 2 nits equivalent,
    toggleable
  - An optional constellation-lines overlay covers the 88 IAU constellations as a single
    LineSegments batch, off by default
  - A governor rung controls skybox resolution tier and the aberration shader applies to the
    panorama exactly as to stars; a Milky Way browser gate ships and the asset budget check stays
    green
handoff_notes: |
  PAUSED 2026-08-16 in REVIEW as PR #84, ten commits on branch task/T0126-milky-way, working tree
  clean, CI re-running at pause time on the orchestrator's merge resolution. If that run is green the
  task is ready to merge; nothing is known to be outstanding.
  THE PANORAMA IS GENUINELY LICENSED: ESO GigaGalaxy Zoom eso0932a (ESO/S. Brunier), CC BY 4.0, pinned
  by SHA-256. No procedural fallback was used. Attribution is in credits.md and the asset SOURCES.md.
  THE ZODIACAL BAND HAD A REAL MODELLING DEFECT, found because a gate measured it. e(eps) saturates
  for eps <= 30 degrees, so the band painted a flat PEAK-brightness disc across a 60 degree cone
  centred on the Sun, directly over the corona. Leinert tabulates zodiacal brightness only above about
  15 degrees for exactly that reason. The band now smoothsteps to zero across that inner working
  angle; since w <= 1 the proven I <= I_peak bound is untouched. Measured background mean luminance in
  the 32-64 px annulus at Mercury distance: 0.102 with the sky suppressed, 19.986 with it on, 10.415
  after the fix, against a threshold of 2.
  A SECOND DEFECT WAS MASKING THE FIRST: proceduralSunPage moves the camera WITHOUT running the frame
  loop, so MilkyWaySky.update() never re-ran and every distance shot carried a frozen 1 AU sky with a
  stale Sun direction. That made the first measurement read 2.075 and look like a marginal overshoot.
  rendering-spec 5.2 now records that any consumer moving the camera outside the frame loop must call
  MilkyWaySky.update() itself.
  THE ABERRATION RULE HAS A NEGATIVE CONTROL: one GLSL chunk is shared by starfield, panorama and
  constellations; the vertex sits at aberrate(d) and the texture is sampled from the UNDISPLACED d.
  Sampling from the aberrated direction instead fails at drift 14.36 against an allowance of 2.17.
  Keep that control if the shader changes.
  Settings generation chain ends at v8 (sky), after v7 (audio) and v6 (exposure). The v7 tier is real,
  with its own strict parser and a round-trip test whose negative control is deleting the tier and
  watching the mixer reset to 0.7/0.5.
