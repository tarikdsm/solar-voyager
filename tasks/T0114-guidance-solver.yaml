id: T0114
title: Constant-acceleration relativistic intercept solver (physics-spec section 8)
status: DONE
agent: claude
branch: task/T0114-guidance-solver
depends_on:
  - T0104
milestone: V2M2
spec: |
  Pure sim guidance module: boost-flip-brake intercept to a rails target under constant proper acceleration, relativistically exact in the 1D profile and vector-corrected by iteration, plus the relativistic braking envelope the assists and cruise brake phase both need.
  Spec of record: docs/superpowers/specs/2026-08-14-v2-free-flight-design.md section 4.3; plan section 3.3.
  Full task definition (files, interfaces, tests, landmines) in docs/superpowers/plans/2026-08-14-v2-free-flight.md, section 5, task T0114.
acceptance:
  - physics-spec.md gains section 8 with the full derivation, symbols matching relativity.ts;
    ADR-037 in the same PR
  - solveInterceptInto and relativisticStopDistanceKm match the plan section 2 signatures, pure and
    allocation-free
  - Earth to Moon, Mars, Jupiter and Neptune plus a LEO to Sun-polar flyby all converge ok=true in
    12 iterations or fewer, arrival miss under 0.1 percent of trip distance under a test integrator
  - The 1D profile matches closed-form hyperbolic motion to 1e-9 relative; stop distance matches the
    exact form
  - Degenerate cases return ok=false cleanly, covering same-body targets, non-positive alpha and
    non-convergence
handoff_notes: |
  THE KAPPA GUARD IS THE MOST IMPORTANT THING HERE. The plan's convergence test alone admits spurious
  roots: re-solving from 75 and 90 percent along a flown Neptune profile converges to 4.23 d and
  1.68 d remaining when the truth is 1.24 d and 0.50 d. Those are real solutions in which the ship
  drifts past Neptune and boosts back, arriving at about 4,000 km/s. The solver rejects them with
  kappa = |v0 - v_target(t0+T)| / (alpha*T/2) <= 0.1. Departure solves measure 0.0019 to 0.036;
  mid-cruise re-solves measure 0.245 to 1.615.
  T0116: THIS IS A DEPARTURE SOLVER. Re-solve only while the ship is still slow against its own
  profile. A mid-cruise ok=false is a routing decision, not an error — switch to the physics-spec
  section 8.7 pursuit rule, which is specified there in full and is yours to implement.
  ARRIVAL IS AT REST IN THE SHIP'S INITIAL DRIFT FRAME, not relative to the target. The insert phase
  must remove v0 - v_target(t_arrival): measured 6.8 km/s Moon, 63.5 Mars, 25.0 Jupiter, 39.2
  Neptune, 38.0 Sun. At 10 g those cost 70 to 650 s and 300 m to 20,000 km of stop distance. On MARS
  that residual's stop distance is 2.02x the 3-radius stand-off, so the insert burn does not fit
  inside the arrival sphere on that route. Expected and correct: the "residual must be brakeable
  inside the stand-off" rule was tried as a validity guard and rejected because it kills the
  canonical Mars route.
  NEVER pass SimulationCore's live RailsState into CompiledRails. It caches the current frame's body
  positions keyed on (timeSec, catalog); the solver evaluates future times through it and would
  silently corrupt every downstream consumer in that frame. Use createCompiledRails, which allocates
  its own. evaluateRailsInto throws RangeError on a non-finite time, so every iterate is validated
  before it reaches rails — a guidance solve must not throw into a director's update(). Preserve that.
  RING-AWARE STAND-OFFS ARE THE CALLER'S TABLE, not the solver's: data/rings.json is game-layer data.
  The solver defaults orbit to 3x R_col and floors everything at R_col. 3x R_col at Jupiter is
  214,476 km, which is INSIDE the Thebe gossamer ring, so the override is mandatory, not cosmetic.
  Numbers are in physics-spec section 8.5.
  EARTH-MARS IS 2.4 AU AT J2026, not the 0.52 AU the plan assumed, so that route is 1.40 d rather
  than about 1.0 d. Arithmetic, not a discrepancy — but T0120 should add a second Mars scenario at a
  near-conjunction t0.
  Two additive fields against plan section 2, updated there in the same PR: iterations (the
  acceptance criterion is a bound on it and it was unobservable) and aimUnit (the profile is defined
  by its thrust axis; nothing can fly it without one). CompiledRails is defined by this task — the
  plan named the type but it did not exist. Plan section 3.3.3 was corrected in place: its
  "flipAt adjusted for initial v-parallel" is a no-op because v0 is already removed inside d_k, and
  "brake to relative rest" is unachievable with a single fixed thrust axis.
  The exact displacement identity in physics-spec section 8.4 is the ready-made basis for an exact
  3-unknown Newton solve if the mid-course loop ever proves insufficient. Deliberately not built: the
  measured miss is already 1e-6 and the gravity term the solver omits is about 1e-4 larger.
  ADR-037 section 7 carries the golden policy T0120 needs, including 1e-9 relative comparison because
  Math.asinh is not bit-reproducible across engines, and the rule that the acceptance numbers are
  contract and may not be widened to make a route pass.
  Verification: 1302 Vitest passed / 3 skipped (+36 new), lint, typecheck, format, build, smoke,
  perf-gates unchanged at 33 draw calls. No bench: nothing outside src/sim/guidance imports either
  module, so the frame loop is provably untouched. No golden or budget moved.
