spec: |
  The point-and-fly loop: pick a body, engage, and arrive in a stable orbit unattended. Game layer only, driving the existing Commands surface, with the phase machine, mid-course re-solve, warp piloting and arrival insertion.
  Spec of record: docs/superpowers/specs/2026-08-14-v2-free-flight-design.md section 4.3; plan sections 2 and 3.3.
  Full task definition (files, interfaces, tests, landmines) in docs/superpowers/plans/2026-08-14-v2-free-flight.md, section 5, task T0116.
acceptance:
  - Phases idle, align, boost, flip, brake, insert, done and aborted per plan section 2; flip uses
    hold-mode slew; mid-course re-solve per plan section 3.3.4
  - Warp piloting requests ladder tiers respecting every existing clamp and decompresses to 100x or
    below within 1 s wall on any player input, abort, SOI change or collision warning
  - LEO to Jupiter orbit arrival reaches e below 0.05 and altitude within 10 percent of the preset
    in 5 wall minutes or less, unattended, proven by a CI browser run
  - Abort at any phase leaves a valid controllable state, fuzzed over 200 random abort times on the
    Mars route
  - "Ledger honesty preserved: cruise energy equals the integrator ledger and matches the analytic
    2(gamma_peak-1)mc^2 bound within 2 percent"
handoff_notes: |
  MEASURED PACING: the CI cruise gate flies LEO to Jupiter unattended in 187.9 s wall against a 300 s
  budget, arriving at e = 0.00061 with altitude within 0.18 percent of the preset, at the CURRENT
  1000x thrust-warp ceiling. Ledger identity 0.99878 / 0.99833. Abort fuzz: 200 runs, 0 failures, max
  decompression 0.10 s. Release criterion 1 therefore already holds without T0115.
  TARGET WRITES GO THROUGH TargetSelectionController, NOT Commands. engage() calls
  selectTarget(id, 'api'); cruiseDirector.ts contains no .setTarget( at all, which the T0117 source
  scan enforces. This is not bookkeeping: the composition facade also re-aims the observatory camera,
  moves the system-map focus and invalidates the trajectory prediction, so writing Commands directly
  engaged a cruise while leaving a stale prediction and the old map focus behind.
  TWO ORDERING DECISIONS IN engage(), both deliberate. The selection is committed BEFORE any director
  state moves and it is the LAST thing that can refuse, because engage() is callable while a cruise is
  already active (the documented abort-resume path) and a late refusal would leave the director
  half-re-engaged with a target it never got. A false return aborts the engagement entirely and leaves
  the director exactly as it was; false can only mean the session catalog and the guidance catalog
  disagree about the body, and flying at a target the rest of the game cannot see is worse than not
  flying. Non-idempotence is correct for this caller and is tested: re-engaging on the current target
  writes again, so the camera re-aims and the prediction re-invalidates.
  THE SOLVER IS A DEPARTURE SOLVER (T0114). Its kappa guard rejects spurious mid-cruise roots, so a
  mid-cruise ok=false is a ROUTING DECISION here, not an error: fall through to the physics-spec
  section 8.7 pursuit endgame. Do not retry the solver harder and do not widen kappa. ADR-043 records
  the rendezvous form of that endgame.
  cruiseScenario.ts and the unit rig each build a REAL TargetSelectionController over the simulation's
  own commands and body ids, so the scenario runner and the CI gate exercise the same path the game
  does rather than a mock.
  ci.yml is prettier-ignored and MUST stay LF; a Windows text rewrite made it CRLF and broke
  ciWorkflow.test.mjs. T0117 hit the same trap independently.
  An abort-fuzz assertion was checking the ship's condition some time AFTER release rather than at the
  moment of release — a different and weaker claim. Fixed in its own commit.
  Verification: 1533 Vitest passed / 3 skipped; lint, typecheck, format, build; test:cruise,
  test:hud-presets, test:system-map green. Cruise numbers bit-identical before and after the
  target-write fix, which is the expected result: it moves WHO writes the target, not what guidance
  does with it. No golden or budget moved.
